name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Write project files
        run: |
          mkdir -p proj && cd proj
          mkdir -p app
          cat > app/build.gradle.kts <<'FILE_END_0'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.kja.webwidget"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.kja.webwidget"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          FILE_END_0
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'FILE_END_1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="@string/app_name"
                  android:icon="@android:drawable/ic_menu_my_calendar"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:launchMode="singleTop"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".WebWidgetProvider"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>
              </application>
          </manifest>
          FILE_END_1
          mkdir -p app/src/main/java/com/kja/webwidget
          cat > app/src/main/java/com/kja/webwidget/Config.kt <<'FILE_END_2'
          package com.kja.webwidget

          object Config {
              // 위젯에 띄울 주소. 바꾸고 싶으면 여기만 수정하면 됩니다.
              const val URL = "https://kja5046.github.io/testify/3/cal.html"
          }
          FILE_END_2
          mkdir -p app/src/main/java/com/kja/webwidget
          cat > app/src/main/java/com/kja/webwidget/MainActivity.kt <<'FILE_END_3'
