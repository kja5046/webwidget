name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Write project files
        run: |
          mkdir -p proj && cd proj
          mkdir -p app
          cat > app/build.gradle.kts <<'FILE_END_0'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.kja.webwidget"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.kja.webwidget"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          FILE_END_0
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'FILE_END_1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="@string/app_name"
                  android:icon="@android:drawable/ic_menu_my_calendar"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".WebWidgetProvider"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>
              </application>
          </manifest>
          FILE_END_1
          mkdir -p app/src/main/java/com/kja/webwidget
          cat > app/src/main/java/com/kja/webwidget/Config.kt <<'FILE_END_2'
          package com.kja.webwidget

          object Config {
              // 위젯에 띄울 주소. 바꾸고 싶으면 여기만 수정하면 됩니다.
              const val URL = "https://kja5046.github.io/testify/3/cal.html"
          }
          FILE_END_2
          mkdir -p app/src/main/java/com/kja/webwidget
          cat > app/src/main/java/com/kja/webwidget/MainActivity.kt <<'FILE_END_3'
          package com.kja.webwidget

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {
              private lateinit var web: WebView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      webViewClient = WebViewClient()
                  }
                  setContentView(web)
                  web.loadUrl(Config.URL)
              }

              // 앱에서 할 일을 고치고 나가면 위젯도 바로 갱신
              override fun onPause() {
                  super.onPause()
                  sendBroadcast(
                      Intent(this, WebWidgetProvider::class.java)
                          .setAction(WebWidgetProvider.ACTION_REFRESH)
                  )
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }

              override fun onDestroy() {
                  web.destroy()
                  super.onDestroy()
              }
          }
          FILE_END_3
          mkdir -p app/src/main/java/com/kja/webwidget
          cat > app/src/main/java/com/kja/webwidget/WebWidgetProvider.kt <<'FILE_END_4'
          package com.kja.webwidget

          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent

          class WebWidgetProvider : AppWidgetProvider() {

              companion object {
                  const val ACTION_REFRESH = "com.kja.webwidget.ACTION_REFRESH"
              }

              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == ACTION_REFRESH) {
                      val manager = AppWidgetManager.getInstance(context)
                      val ids = manager.getAppWidgetIds(ComponentName(context, WebWidgetProvider::class.java))
                      refresh(context, ids)
                  } else {
                      super.onReceive(context, intent)
                  }
              }

              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  refresh(context, appWidgetIds)
              }

              private fun refresh(context: Context, ids: IntArray) {
                  if (ids.isEmpty()) return
                  val pending = goAsync()
                  WidgetRenderer.renderAll(context.applicationContext, ids) { pending.finish() }
              }
          }
          FILE_END_4
          mkdir -p app/src/main/java/com/kja/webwidget
          cat > app/src/main/java/com/kja/webwidget/WidgetRenderer.kt <<'FILE_END_5'
          package com.kja.webwidget

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.content.Context
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.RemoteViews
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          /**
           * cal.html은 할 일을 브라우저 저장소(localStorage)의 'pink_notion_final'에
           * {"2026-11-12": ["할 일1", "할 일2"], ...} 형태로 저장한다.
           * 같은 주소(https://kja5046.github.io)로 보이지 않는 WebView를 열어
           * 그 저장소를 읽고, 오늘 날짜의 할 일만 위젯에 글자로 표시한다.
           */
          object WidgetRenderer {
              private const val STORAGE_KEY = "pink_notion_final"
              private const val ORIGIN = "https://kja5046.github.io/"
              private const val TIMEOUT_MS = 6000L
              private val handler = Handler(Looper.getMainLooper())

              fun renderAll(context: Context, ids: IntArray, onDone: () -> Unit) {
                  val todayKey = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
                  var finished = false
                  var webView: WebView? = null

                  fun finish(tasks: List<String>?) {
                      if (finished) return
                      finished = true
                      try {
                          val manager = AppWidgetManager.getInstance(context)
                          for (id in ids) manager.updateAppWidget(id, buildViews(context, tasks))
                          scheduleMidnightRefresh(context)
                      } finally {
                          webView?.destroy()
                          onDone()
                      }
                  }

                  try {
                      webView = WebView(context).apply {
                          settings.javaScriptEnabled = true
                          settings.domStorageEnabled = true
                          webViewClient = object : WebViewClient() {
                              override fun onPageFinished(view: WebView, url: String) {
                                  view.evaluateJavascript("localStorage.getItem('$STORAGE_KEY')") { result ->
                                      finish(parseTasks(result, todayKey))
                                  }
                              }
                          }
                      }
                      handler.postDelayed({ finish(null) }, TIMEOUT_MS)
                      // 인터넷 없이도 같은 주소의 저장소에 접근하도록 빈 페이지를 그 주소로 연다
                      webView.loadDataWithBaseURL(ORIGIN, "<html></html>", "text/html", "UTF-8", null)
                  } catch (e: Exception) {
                      finish(null)
                  }
              }

              private fun parseTasks(jsResult: String?, todayKey: String): List<String> {
                  if (jsResult == null || jsResult == "null") return emptyList()
                  return try {
                      val raw = JSONArray("[$jsResult]").getString(0)
                      val arr = JSONObject(raw).optJSONArray(todayKey) ?: return emptyList()
                      List(arr.length()) { arr.getString(it) }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              private fun buildViews(context: Context, tasks: List<String>?): RemoteViews {
                  val flags = PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  val openApp = PendingIntent.getActivity(
                      context, 0, Intent(context, MainActivity::class.java), flags
                  )
                  val title = SimpleDateFormat("M월 d일 (E)", Locale.KOREAN).format(Date()) + " 할 일"
                  val body = when {
                      tasks == null -> context.getString(R.string.failed)
                      tasks.isEmpty() -> context.getString(R.string.empty)
                      else -> tasks.joinToString("\n") { "• $it" }
                  }
                  return RemoteViews(context.packageName, R.layout.widget).apply {
                      setTextViewText(R.id.widget_title, title)
                      setTextViewText(R.id.widget_tasks, body)
                      setOnClickPendingIntent(R.id.widget_root, openApp)
                      setOnClickPendingIntent(R.id.widget_refresh, refreshIntent(context))
                  }
              }

              private fun refreshIntent(context: Context): PendingIntent =
                  PendingIntent.getBroadcast(
                      context, 1,
                      Intent(context, WebWidgetProvider::class.java).setAction(WebWidgetProvider.ACTION_REFRESH),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

              // 자정이 지나면 다음 날 할 일로 바뀌도록 예약
              private fun scheduleMidnightRefresh(context: Context) {
                  val next = Calendar.getInstance().apply {
                      add(Calendar.DAY_OF_YEAR, 1)
                      set(Calendar.HOUR_OF_DAY, 0)
                      set(Calendar.MINUTE, 0)
                      set(Calendar.SECOND, 5)
                      set(Calendar.MILLISECOND, 0)
                  }
                  val alarm = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  alarm.set(AlarmManager.RTC, next.timeInMillis, refreshIntent(context))
              }
          }
          FILE_END_5
          mkdir -p app/src/main/res/drawable
