          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/app_icon"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:launchMode="singleTop"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".WebWidgetProvider"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>
              </application>
          </manifest>
          F1
          mkdir -p app/src/main/java/com/kja/webwidget
          cat > app/src/main/java/com/kja/webwidget/Config.kt <<'F2'
          package com.kja.webwidget

          object Config {
              // 위젯에 띄울 주소. 바꾸고 싶으면 여기만 수정하면 됩니다.
              const val URL = "https://kja5046.github.io/testify/3/cal.html"
          }
          F2
          mkdir -p app/src/main/java/com/kja/webwidget
          cat > app/src/main/java/com/kja/webwidget/MainActivity.kt <<'F3'
          package com.kja.webwidget

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity() {
              companion object {
                  const val EXTRA_ADD_TODAY = "add_today"
              }

              private lateinit var web: WebView
              private var openTodayOnLoad = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  openTodayOnLoad = intent.getBooleanExtra(EXTRA_ADD_TODAY, false)
                  web = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      webViewClient = object : WebViewClient() {
                          override fun onPageFinished(view: WebView, url: String) {
                              if (openTodayOnLoad) {
                                  openTodayOnLoad = false
                                  openTodayModal()
                              }
                          }
                      }
                  }
                  setContentView(web)
                  web.loadUrl(Config.URL)
              }

              // 위젯에서 다시 열면 위젯에서 지운 내용까지 반영되도록 새로 불러온다
              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  if (intent.getBooleanExtra(EXTRA_ADD_TODAY, false)) {
                      openTodayOnLoad = true
                      web.reload()
                  }
              }

              override fun onRestart() {
                  super.onRestart()
                  if (!openTodayOnLoad) web.reload()
              }

              // 오늘 날짜의 to do list 창을 바로 연다
              private fun openTodayModal() {
                  val today = JSONObject.quote(SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date()))
                  web.evaluateJavascript(
                      "try { selectedDate = $today; updateTaskListUI();" +
                          " modal.style.display = 'flex'; taskInput.focus(); } catch (e) {}",
                      null
                  )
              }

              // 앱에서 할 일을 고치고 나가면 위젯도 바로 갱신
              override fun onPause() {
                  super.onPause()
                  sendBroadcast(
                      Intent(this, WebWidgetProvider::class.java)
                          .setAction(WebWidgetProvider.ACTION_REFRESH)
                  )
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }

              override fun onDestroy() {
                  web.destroy()
                  super.onDestroy()
              }
          }
          F3
          mkdir -p app/src/main/java/com/kja/webwidget
          cat > app/src/main/java/com/kja/webwidget/WebWidgetProvider.kt <<'F4'
          package com.kja.webwidget

          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent

          class WebWidgetProvider : AppWidgetProvider() {

              companion object {
                  const val ACTION_REFRESH = "com.kja.webwidget.ACTION_REFRESH"
                  const val ACTION_DELETE = "com.kja.webwidget.ACTION_DELETE"
                  const val EXTRA_DATE = "date"
                  const val EXTRA_TEXT = "text"
              }

              override fun onReceive(context: Context, intent: Intent) {
                  when (intent.action) {
                      ACTION_REFRESH -> refresh(context, null)
                      ACTION_DELETE -> {
                          val date = intent.getStringExtra(EXTRA_DATE)
                          val text = intent.getStringExtra(EXTRA_TEXT)
                          refresh(context, if (date != null && text != null) Pair(date, text) else null)
                      }
                      else -> super.onReceive(context, intent)
                  }
              }

              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  refresh(context, null)
              }

              private fun refresh(context: Context, delete: Pair<String, String>?) {
                  val manager = AppWidgetManager.getInstance(context)
                  val ids = manager.getAppWidgetIds(ComponentName(context, WebWidgetProvider::class.java))
                  if (ids.isEmpty()) return
                  val pending = goAsync()
                  WidgetRenderer.renderAll(context.applicationContext, ids, delete) { pending.finish() }
              }
          }
          F4
          mkdir -p app/src/main/java/com/kja/webwidget
          cat > app/src/main/java/com/kja/webwidget/WidgetRenderer.kt <<'F5'
          package com.kja.webwidget

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.content.Context
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.RemoteViews
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          /**
           * cal.html의 할 일(localStorage 'pink_notion_final')을 읽어
           * 오늘 날짜 것만 cal.html의 to do list 창과 같은 모양으로 보여준다.
           * ✕ 를 누르면 cal.html에서 지울 때와 똑같이 그 할 일이 삭제된다.
           */
          object WidgetRenderer {
              private const val ORIGIN = "https://kja5046.github.io/"
              private const val MAX_ROWS = 8
              private const val TIMEOUT_MS = 6000L
              private val handler = Handler(Looper.getMainLooper())

              fun renderAll(context: Context, ids: IntArray, delete: Pair<String, String>?, onDone: () -> Unit) {
                  val today = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
                  var finished = false
                  var webView: WebView? = null

                  fun finish(tasks: List<String>?) {
                      if (finished) return
                      finished = true
                      try {
                          val manager = AppWidgetManager.getInstance(context)
                          val views = buildViews(context, today, tasks)
                          for (id in ids) manager.updateAppWidget(id, views)
                          scheduleMidnightRefresh(context)
                      } finally {
                          webView?.destroy()
                          onDone()
                      }
                  }

                  val deleteJs = if (delete == null) "" else """
                      var td = ${JSONObject.quote(delete.first)}, tt = ${JSONObject.quote(delete.second)};
                      var ta = ev[td] || []; var ti = ta.indexOf(tt);
                      if (ti >= 0) {
                        ta.splice(ti, 1);
                        if (ta.length) ev[td] = ta; else delete ev[td];
                        localStorage.setItem('pink_notion_final', JSON.stringify(ev));
                      }
                  """
                  val script = """
                      (function() {
                        var ev = JSON.parse(localStorage.getItem('pink_notion_final') || '{}');
                        $deleteJs
                        return JSON.stringify(ev[${JSONObject.quote(today)}] || []);
                      })()
                  """

                  try {
                      webView = WebView(context).apply {
                          settings.javaScriptEnabled = true
                          settings.domStorageEnabled = true
                          webViewClient = object : WebViewClient() {
                              override fun onPageFinished(view: WebView, url: String) {
                                  view.evaluateJavascript(script) { result -> finish(parse(result)) }
                              }
                          }
                      }
                      handler.postDelayed({ finish(null) }, TIMEOUT_MS)
                      webView.loadDataWithBaseURL(ORIGIN, "<html></html>", "text/html", "UTF-8", null)
                  } catch (e: Exception) {
                      finish(null)
                  }
              }

              private fun parse(jsResult: String?): List<String>? {
                  if (jsResult == null || jsResult == "null") return null
                  return try {
                      val arr = JSONArray(JSONArray("[$jsResult]").getString(0))
                      List(arr.length()) { arr.getString(it) }
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun buildViews(context: Context, today: String, tasks: List<String>?): RemoteViews {
                  val pkg = context.packageName
                  val res = context.resources
                  fun id(name: String) = res.getIdentifier(name, "id", pkg)
                  val flags = PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT

                  val views = RemoteViews(pkg, R.layout.widget)

                  // 위젯을 누르면 앱에서 오늘 날짜의 to do list 창이 바로 열림
                  val openToday = PendingIntent.getActivity(
                      context, 2,
                      Intent(context, MainActivity::class.java).putExtra(MainActivity.EXTRA_ADD_TODAY, true),
                      flags
                  )
                  val refresh = PendingIntent.getBroadcast(
                      context, 1,
                      Intent(context, WebWidgetProvider::class.java).setAction(WebWidgetProvider.ACTION_REFRESH),
                      flags
                  )
                  views.setOnClickPendingIntent(R.id.widget_root, openToday)
                  views.setOnClickPendingIntent(R.id.widget_title, openToday)
                  views.setOnClickPendingIntent(R.id.widget_add, openToday)
                  views.setOnClickPendingIntent(R.id.widget_empty, if (tasks == null) refresh else openToday)

                  if (tasks.isNullOrEmpty()) {
                      views.setViewVisibility(R.id.widget_empty, View.VISIBLE)
                      views.setTextViewText(
                          R.id.widget_empty,
                          context.getString(if (tasks == null) R.string.failed else R.string.empty)
                      )
                  } else {
                      views.setViewVisibility(R.id.widget_empty, View.GONE)
                  }

                  val shown = tasks.orEmpty().take(MAX_ROWS)
                  for (i in 0 until MAX_ROWS) {
                      val rowId = id("row$i")
                      if (i >= shown.size) {
                          views.setViewVisibility(rowId, View.GONE)
                          continue
                      }
                      val text = shown[i]
                      views.setViewVisibility(rowId, View.VISIBLE)
                      views.setTextViewText(id("text$i"), text)
                      views.setOnClickPendingIntent(rowId, openToday)

                      val delete = PendingIntent.getBroadcast(
                          context, 100 + i,
                          Intent(context, WebWidgetProvider::class.java)
                              .setAction(WebWidgetProvider.ACTION_DELETE)
                              .putExtra(WebWidgetProvider.EXTRA_DATE, today)
                              .putExtra(WebWidgetProvider.EXTRA_TEXT, text),
                          flags
                      )
                      views.setOnClickPendingIntent(id("del$i"), delete)
                  }

                  val extra = tasks.orEmpty().size - shown.size
                  if (extra > 0) {
                      views.setViewVisibility(R.id.widget_more, View.VISIBLE)
                      views.setTextViewText(R.id.widget_more, "외 ${extra}개 더")
                      views.setOnClickPendingIntent(R.id.widget_more, openToday)
                  } else {
                      views.setViewVisibility(R.id.widget_more, View.GONE)
                  }
                  return views
              }

              // 자정이 지나면 다음 날 할 일로 바뀌도록 예약
              private fun scheduleMidnightRefresh(context: Context) {
                  val next = Calendar.getInstance().apply {
                      add(Calendar.DAY_OF_YEAR, 1)
                      set(Calendar.HOUR_OF_DAY, 0)
                      set(Calendar.MINUTE, 0)
                      set(Calendar.SECOND, 5)
                      set(Calendar.MILLISECOND, 0)
                  }
                  val refresh = PendingIntent.getBroadcast(
                      context, 1,
                      Intent(context, WebWidgetProvider::class.java).setAction(WebWidgetProvider.ACTION_REFRESH),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val alarm = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  alarm.set(AlarmManager.RTC, next.timeInMillis, refresh)
              }
          }
          F5
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/item_bg.xml <<'F6'
          <?xml version="1.0" encoding="utf-8"?>
