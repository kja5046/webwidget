          F7
          mkdir -p app/src/main/res/layout
          L=app/src/main/res/layout/widget.xml
          cat > $L <<'HEAD_END'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="20dp"
              android:background="@drawable/widget_bg">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginBottom="14dp"
                  android:orientation="horizontal"
                  android:gravity="center_vertical">

                  <TextView
                      android:id="@+id/widget_title"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="@string/title"
                      android:textColor="#FF8FA3"
                      android:textSize="17sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/widget_add"
                      android:layout_width="32dp"
                      android:layout_height="32dp"
                      android:gravity="center"
                      android:text="+"
                      android:textColor="#FCC3D2"
                      android:textSize="24sp"
                      android:contentDescription="@string/add" />
              </LinearLayout>

              <TextView
                  android:id="@+id/widget_empty"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:paddingTop="6dp"
                  android:paddingBottom="6dp"
                  android:text="@string/loading"
                  android:textColor="#AAAAAA"
                  android:textSize="14sp" />
          HEAD_END
          for i in 0 1 2 3 4 5 6 7; do
          cat >> $L <<ROW_END

              <LinearLayout
                  android:id="@+id/row$i"
                  android:layout_width="match_parent"
                  android:layout_height="46dp"
                  android:layout_marginBottom="8dp"
                  android:paddingStart="16dp"
                  android:paddingEnd="4dp"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:background="@drawable/item_bg"
                  android:visibility="gone">

                  <TextView
                      android:id="@+id/text$i"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:maxLines="1"
                      android:ellipsize="end"
                      android:fontFamily="sans-serif-medium"
                      android:textColor="#555555"
                      android:textSize="15sp" />

                  <TextView
                      android:id="@+id/del$i"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:gravity="center"
                      android:text="✕"
                      android:textColor="#FCC3D2"
                      android:textSize="16sp"
                      android:contentDescription="@string/delete" />
              </LinearLayout>
          ROW_END
          done
          cat >> $L <<'TAIL_END'

              <TextView
                  android:id="@+id/widget_more"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textColor="#AAAAAA"
                  android:textSize="12sp"
                  android:visibility="gone" />
          </LinearLayout>
          TAIL_END
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'F8'
          <resources>
              <string name="app_name">핑크 플래너</string>
              <string name="widget_desc">오늘 할 일 목록을 표시합니다</string>
              <string name="title">to do list</string>
              <string name="loading">불러오는 중…</string>
              <string name="empty">오늘 할 일이 없어요 🌸</string>
              <string name="failed">불러오기 실패 · 탭해서 다시 시도</string>
              <string name="add">할 일 추가</string>
              <string name="delete">삭제</string>
          </resources>
          F8
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/widget_info.xml <<'F9'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="180dp"
              android:minResizeWidth="180dp"
              android:minResizeHeight="110dp"
              android:targetCellWidth="4"
              android:targetCellHeight="3"
              android:resizeMode="horizontal|vertical"
              android:updatePeriodMillis="1800000"
              android:widgetCategory="home_screen"
              android:description="@string/widget_desc"
              android:previewImage="@drawable/app_icon"
              android:initialLayout="@layout/widget" />
          F9
          cat > build.gradle.kts <<'F10'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          F10
          cat > gradle.properties <<'F11'
          org.gradle.jvmargs=-Xmx2048m
          kotlin.code.style=official
          F11
          cat > settings.gradle.kts <<'F12'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
