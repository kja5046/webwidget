name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Write project files
        run: |
          mkdir -p proj && cd proj
          mkdir -p app
          cat > app/build.gradle.kts <<'FILE_END_0'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.kja.webwidget"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.kja.webwidget"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          FILE_END_0
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'FILE_END_1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="@string/app_name"
                  android:icon="@android:drawable/ic_menu_my_calendar"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".WebWidgetProvider"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>
              </application>
          </manifest>
          FILE_END_1
          mkdir -p app/src/main/java/com/kja/webwidget
          cat > app/src/main/java/com/kja/webwidget/Config.kt <<'FILE_END_2'
          package com.kja.webwidget

          object Config {
              // 위젯에 띄울 주소. 바꾸고 싶으면 여기만 수정하면 됩니다.
              const val URL = "https://kja5046.github.io/testify/3/cal.html"
          }
          FILE_END_2
          mkdir -p app/src/main/java/com/kja/webwidget
          cat > app/src/main/java/com/kja/webwidget/MainActivity.kt <<'FILE_END_3'
          package com.kja.webwidget

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {
              private lateinit var web: WebView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      webViewClient = WebViewClient()
                  }
                  setContentView(web)
                  web.loadUrl(Config.URL)

                  // 앱을 열 때 위젯도 함께 새로고침
                  sendBroadcast(
                      Intent(this, WebWidgetProvider::class.java)
                          .setAction(WebWidgetProvider.ACTION_REFRESH)
                  )
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }

              override fun onDestroy() {
                  web.destroy()
                  super.onDestroy()
              }
          }
          FILE_END_3
          mkdir -p app/src/main/java/com/kja/webwidget
          cat > app/src/main/java/com/kja/webwidget/WebWidgetProvider.kt <<'FILE_END_4'
          package com.kja.webwidget

          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle

          class WebWidgetProvider : AppWidgetProvider() {

              companion object {
                  const val ACTION_REFRESH = "com.kja.webwidget.ACTION_REFRESH"
              }

              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == ACTION_REFRESH) {
                      val manager = AppWidgetManager.getInstance(context)
                      val ids = manager.getAppWidgetIds(ComponentName(context, WebWidgetProvider::class.java))
                      renderAll(context, ids)
                  } else {
                      super.onReceive(context, intent)
                  }
              }

              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  renderAll(context, appWidgetIds)
              }

              override fun onAppWidgetOptionsChanged(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetId: Int,
                  newOptions: Bundle
              ) {
                  // 위젯 크기를 바꾸면 새 크기에 맞춰 다시 그림
                  renderAll(context, intArrayOf(appWidgetId))
              }

              private fun renderAll(context: Context, ids: IntArray) {
                  if (ids.isEmpty()) return
                  val pending = goAsync()
                  val appContext = context.applicationContext
                  var remaining = ids.size
                  for (id in ids) {
                      WidgetRenderer.render(appContext, id) {
                          remaining -= 1
                          if (remaining == 0) pending.finish()
                      }
                  }
              }
          }
          FILE_END_4
          mkdir -p app/src/main/java/com/kja/webwidget
          cat > app/src/main/java/com/kja/webwidget/WidgetRenderer.kt <<'FILE_END_5'
          package com.kja.webwidget

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.content.Context
          import android.content.Intent
          import android.content.res.Configuration
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.RemoteViews

          /**
           * 화면에 보이지 않는 WebView로 페이지를 불러와 이미지로 찍은 뒤
           * 그 이미지를 위젯에 표시한다. (위젯 안에는 WebView를 직접 넣을 수 없음)
           */
          object WidgetRenderer {
              private const val SETTLE_DELAY_MS = 1500L // 페이지 로드 후 JS가 그릴 시간
              private const val TIMEOUT_MS = 8000L
              private val handler = Handler(Looper.getMainLooper())

              fun render(context: Context, widgetId: Int, onDone: () -> Unit) {
                  val manager = AppWidgetManager.getInstance(context)
                  try {
                      showStatus(context, manager, widgetId, context.getString(R.string.loading))

                      val (width, height) = widgetSizePx(context, manager, widgetId)
                      val webView = WebView(context).apply {
                          settings.javaScriptEnabled = true
                          settings.domStorageEnabled = true
                          setBackgroundColor(Color.WHITE)
                          setLayerType(View.LAYER_TYPE_SOFTWARE, null)
                          measure(
                              View.MeasureSpec.makeMeasureSpec(width, View.MeasureSpec.EXACTLY),
                              View.MeasureSpec.makeMeasureSpec(height, View.MeasureSpec.EXACTLY)
                          )
                          layout(0, 0, width, height)
                      }

                      var finished = false
                      lateinit var capture: Runnable
                      capture = Runnable {
                          if (finished) return@Runnable
                          finished = true
                          try {
                              val bitmap = Bitmap.createBitmap(width, height, Bitmap.Config.ARGB_8888)
                              val canvas = Canvas(bitmap)
                              canvas.drawColor(Color.WHITE)
                              webView.draw(canvas)
                              pushBitmap(context, manager, widgetId, bitmap)
                          } catch (e: Exception) {
                              showStatus(context, manager, widgetId, context.getString(R.string.failed))
                          } finally {
                              handler.removeCallbacks(capture)
                              webView.stopLoading()
                              webView.destroy()
                              onDone()
                          }
                      }

                      webView.webViewClient = object : WebViewClient() {
                          override fun onPageFinished(view: WebView, url: String) {
                              handler.postDelayed(capture, SETTLE_DELAY_MS)
                          }
                      }
                      handler.postDelayed(capture, TIMEOUT_MS)
                      webView.loadUrl(Config.URL)
                  } catch (e: Exception) {
                      showStatus(context, manager, widgetId, context.getString(R.string.failed))
                      onDone()
                  }
              }

              private fun widgetSizePx(context: Context, manager: AppWidgetManager, id: Int): Pair<Int, Int> {
                  val opts = manager.getAppWidgetOptions(id)
                  val density = context.resources.displayMetrics.density
                  val portrait = context.resources.configuration.orientation == Configuration.ORIENTATION_PORTRAIT
                  val wKey = if (portrait) AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH else AppWidgetManager.OPTION_APPWIDGET_MAX_WIDTH
                  val hKey = if (portrait) AppWidgetManager.OPTION_APPWIDGET_MAX_HEIGHT else AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT
                  val wDp = opts.getInt(wKey, 0).takeIf { it > 0 } ?: 300
                  val hDp = opts.getInt(hKey, 0).takeIf { it > 0 } ?: 300
                  return Pair((wDp * density).toInt(), (hDp * density).toInt())
              }

              private fun baseViews(context: Context): RemoteViews {
                  val flags = PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  val openApp = PendingIntent.getActivity(
                      context, 0, Intent(context, MainActivity::class.java), flags
                  )
                  val refresh = PendingIntent.getBroadcast(
                      context, 1,
                      Intent(context, WebWidgetProvider::class.java).setAction(WebWidgetProvider.ACTION_REFRESH),
                      flags
                  )
                  return RemoteViews(context.packageName, R.layout.widget).apply {
                      setOnClickPendingIntent(R.id.widget_image, openApp)
                      setOnClickPendingIntent(R.id.widget_status, refresh)
                      setOnClickPendingIntent(R.id.widget_refresh, refresh)
                  }
              }

              private fun pushBitmap(context: Context, manager: AppWidgetManager, id: Int, bitmap: Bitmap) {
                  val views = baseViews(context).apply {
                      setImageViewBitmap(R.id.widget_image, bitmap)
                      setViewVisibility(R.id.widget_status, View.GONE)
                  }
                  manager.updateAppWidget(id, views)
              }

              private fun showStatus(context: Context, manager: AppWidgetManager, id: Int, text: String) {
                  val views = baseViews(context).apply {
                      setTextViewText(R.id.widget_status, text)
                      setViewVisibility(R.id.widget_status, View.VISIBLE)
                  }
                  // 기존 이미지는 그대로 두고 상태 문구만 겹쳐 표시
                  manager.partiallyUpdateAppWidget(id, views)
              }
          }
          FILE_END_5
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/widget.xml <<'FILE_END_6'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@android:color/white">

              <ImageView
                  android:id="@+id/widget_image"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitCenter"
                  android:contentDescription="@string/app_name" />

              <TextView
                  android:id="@+id/widget_status"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:gravity="center"
                  android:background="#CCFFFFFF"
                  android:textColor="#555555"
                  android:textSize="14sp"
                  android:text="@string/loading" />

              <ImageView
                  android:id="@+id/widget_refresh"
                  android:layout_width="32dp"
                  android:layout_height="32dp"
                  android:layout_gravity="top|end"
                  android:layout_margin="4dp"
                  android:padding="6dp"
                  android:background="#55000000"
                  android:src="@android:drawable/ic_popup_sync"
                  android:contentDescription="@string/refresh" />
          </FrameLayout>
          FILE_END_6
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'FILE_END_7'
          <resources>
              <string name="app_name">웹 위젯</string>
              <string name="widget_desc">웹페이지를 홈 화면에 표시합니다</string>
              <string name="loading">불러오는 중…</string>
              <string name="failed">불러오기 실패 · 탭해서 다시 시도</string>
              <string name="refresh">새로고침</string>
          </resources>
          FILE_END_7
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/widget_info.xml <<'FILE_END_8'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="180dp"
              android:minResizeWidth="110dp"
              android:minResizeHeight="110dp"
              android:targetCellWidth="4"
              android:targetCellHeight="3"
              android:resizeMode="horizontal|vertical"
              android:updatePeriodMillis="1800000"
              android:widgetCategory="home_screen"
              android:description="@string/widget_desc"
              android:initialLayout="@layout/widget" />
          FILE_END_8
          cat > build.gradle.kts <<'FILE_END_9'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          FILE_END_9
          cat > gradle.properties <<'FILE_END_10'
          org.gradle.jvmargs=-Xmx2048m
          kotlin.code.style=official
          FILE_END_10
          cat > settings.gradle.kts <<'FILE_END_11'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "WebWidget"
          include(":app")
          FILE_END_11
      - name: Build
        working-directory: proj
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: web-widget-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
